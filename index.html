<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Beautiful Natalie</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffeef2 0%, #ffd1dc 100%);
            --primary-pink: #ff4b6b;
            --deep-rose: #c9183b;
            --text-color: #3d1c24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 15px;
        }

        /* Ambient subtle floating hearts */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Glassmorphism Card Container */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px rgba(199, 24, 59, 0.15);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInCard 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInCard {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Upgraded Flower Bouquet Canvas Frame */
        .bouquet-container {
            width: 100%;
            height: 340px;
            position: relative;
            margin-bottom: 20px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Love Letter Style */
        h1 {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 1.6rem;
            color: var(--deep-rose);
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .message-box {
            font-size: 1.05rem;
            line-height: 1.8;
            min-height: 190px;
            text-align: left;
            margin-bottom: 25px;
            padding: 0 5px;
            font-family: 'Poppins', sans-serif;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1rem;
            background-color: var(--deep-rose);
            margin-left: 3px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Action Button */
        .bloom-btn {
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--deep-rose) 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(201, 24, 59, 0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bloom-btn:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 25px rgba(201, 24, 59, 0.45);
        }

        .bloom-btn:active {
            transform: scale(0.98) translateY(1px);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambientBg"></div>

    <!-- Native Audio Element: Using the included file in the repo -->
    <audio id="loveSong" preload="auto">
        <source src="New West - Those Eyes.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="card">
        <div class="bouquet-container">
            <canvas id="bouquetCanvas"></canvas>
        </div>
        
        <h1 id="title">For Natalie, My Adorable One</h1>
        
        <div class="message-box">
            <span id="typedText"></span><span class="cursor" id="cursor"></span>
        </div>

        <button class="bloom-btn" id="startBtn">Open with Love</button>
    </div>

    <script>
        const canvas = document.getElementById('bouquetCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const typedTextEl = document.getElementById('typedText');
        const cursor = document.getElementById('cursor');
        const song = document.getElementById('loveSong');

        // Add a single, easy-to-edit constant for the audio start time (in seconds).
        // CHANGE THIS LINE to adjust where the music starts (in seconds):
        const AUDIO_PREFERRED_START_SECONDS = 165.0; // <-- edit this value

        // Preload metadata/audio as early as allowed to minimize latency when the user taps.
        try {
            song.preload = 'auto';
            // Calling load() here encourages the browser to fetch metadata ahead of time.
            // NOTE: some browsers will delay network activity until user gesture, but most will still load metadata when allowed.
            song.load();
        } catch (e) {
            console.log('Preload/load not supported or blocked:', e);
        }

        // High-res retina canvas support and responsive resize
        const dpr = window.devicePixelRatio || 1;
        function resizeCanvas() {
            const w = canvas.clientWidth || canvas.parentElement.clientWidth;
            const h = canvas.clientHeight || canvas.parentElement.clientHeight;
            canvas.width = Math.max(1, Math.floor(w * dpr));
            canvas.height = Math.max(1, Math.floor(h * dpr));
            // Reset transform so drawing works with devicePixelRatio
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        // A heartfelt, natural-sounding message (single variable)
        const msg = `Hey love,

I don't say it enough in words, but I notice everything about you. How your smile softens the room, how your laugh makes my day lighter, and how kind you are even when you're tired. You make me smile [...]

I promise I'll be there for the silly mornings, the quiet nights, and the messy in-between. I'll hold your hand through the storms and cheer the loudest when things go well.

You are my favorite person to be with. I love you so much, and gently. ALWAYS!

— Baby Einstein😘💕.`;

        // Soft drifting background
        function createParticle() {
            const ambient = document.getElementById('ambientBg');
            const element = document.createElement('div');
            element.innerHTML = Math.random() > 0.5 ? '❤️' : '🌸';
            element.style.position = 'absolute';
            element.style.left = Math.random() * 100 + 'vw';
            element.style.top = '100vh';
            element.style.fontSize = (Math.random() * 12 + 12) + 'px';
            element.style.opacity = Math.random() * 0.3 + 0.15;
            element.style.pointerEvents = 'none';
            element.style.transition = 'transform 7s linear, opacity 7s linear';
            
            ambient.appendChild(element);

            setTimeout(() => {
                element.style.transform = `translateY(-115vh) translateX(${Math.random() * 60 - 30}px) rotate(${Math.random() * 360}deg)`;
            }, 50);

            setTimeout(() => { element.remove(); }, 7000);
        }
        setInterval(createParticle, 900);

        // Highly Realistic Canvas Flower Drawing
        let flowers = [];

        class AdvancedFlower {
            constructor(x, y, targetSize, type, delay) {
                this.x = x;
                this.y = y;
                this.targetSize = targetSize;
                this.currentSize = 0;
                this.type = type; // 'crimson-rose', 'sunset-rose', 'royal-tulip'
                this.delay = delay;
                this.growthSpeed = Math.random() * 0.3 + 0.35;
                this.rotation = Math.random() * Math.PI * 2;
            }

            draw() {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }
                if (this.currentSize < this.targetSize) {
                    this.currentSize += this.growthSpeed;
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.type === 'crimson-rose' || this.type === 'sunset-rose') {
                    // Upgraded layered rose structure
                    const baseColor = this.type === 'crimson-rose' ? '#A3001C' : '#E03B5C';
                    const midColor = this.type === 'crimson-rose' ? '#D61C3C' : '#F76B8A';
                    const lightColor = this.type === 'crimson-rose' ? '#FF5C77' : '#FFA8BA';

                    // Layer 1: Base petals (outer structure)
                    ctx.fillStyle = baseColor;
                    for (let i = 0; i < 8; i++) {
                        ctx.beginPath();
                        ctx.ellipse(0, -this.currentSize * 0.6, this.currentSize * 0.5, this.currentSize * 0.75, 0.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.rotate(Math.PI / 4);
                    }

                    // Layer 2: Middle overlapping details
                    ctx.fillStyle = midColor;
                    for (let i = 0; i < 6; i++) {
                        ctx.beginPath();
                        ctx.ellipse(0, -this.currentSize * 0.45, this.currentSize * 0.4, this.currentSize * 0.55, -0.1, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.rotate(Math.PI / 3);
                    }

                    // Layer 3: Highlighting layers
                    ctx.fillStyle = lightColor;
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.ellipse(0, -this.currentSize * 0.3, this.currentSize * 0.25, this.currentSize * 0.4, 0.1, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.rotate((Math.PI * 2) / 5);
                    }

                    // Center tight bud
                    ctx.beginPath();
                    ctx.arc(0, 0, this.currentSize * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = this.type === 'crimson-rose' ? '#61000E' : '#9E1E38';
                    ctx.fill();

                } else if (this.type === 'royal-tulip') {
                    // Tulip petals with elegant curvature and soft gradient shading
                    ctx.fillStyle = '#6D214F'; // Deep purple base

                    // Left petal shadow
                    ctx.beginPath();
                    ctx.ellipse(-this.currentSize * 0.28, -this.currentSize * 0.35, this.currentSize * 0.25, this.currentSize * 0.8, -0.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Right petal shadow
                    ctx.beginPath();
                    ctx.ellipse(this.currentSize * 0.28, -this.currentSize * 0.35, this.currentSize * 0.25, this.currentSize * 0.8, 0.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Soft light purple overlay
                    ctx.fillStyle = '#8B3A8B'; 
                    ctx.beginPath();
                    ctx.ellipse(-this.currentSize * 0.15, -this.currentSize * 0.35, this.currentSize * 0.22, this.currentSize * 0.78, -0.1, 0, Math.PI * 2);
                    ctx.ellipse(this.currentSize * 0.15, -this.currentSize * 0.35, this.currentSize * 0.22, this.currentSize * 0.78, 0.1, 0, Math.PI * 2);
                    ctx.fill();

                    // Lighter centerpiece petal wrapping it up
                    ctx.fillStyle = '#C15C9C';
                    ctx.beginPath();
                    ctx.ellipse(0, -this.currentSize * 0.4, this.currentSize * 0.3, this.currentSize * 0.82, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function initBouquet() {
            const centerX = canvas.clientWidth / 2;
            const centerY = canvas.clientHeight / 2 + 10;
            flowers = [];

            // Dense, organic bouquet blueprint
            const layout = [
                {x: 0, y: -25, r: 27, type: 'crimson-rose'},    // Central Rose
                {x: -40, y: -50, r: 23, type: 'sunset-rose'},   // Soft pink top-left
                {x: 40, y: -50, r: 23, type: 'sunset-rose'},    // Soft pink top-right
                {x: -55, y: 10, r: 23, type: 'royal-tulip'},    // Tulip mid-left
                {x: 55, y: 10, r: 23, type: 'royal-tulip'},     // Tulip mid-right
                {x: -25, y: 35, r: 26, type: 'crimson-rose'},   // Dark red low-left
                {x: 25, y: 35, r: 25, type: 'sunset-rose'},     // Soft pink low-right
                {x: 0, y: -80, r: 21, type: 'royal-tulip'},     // Tulip crowning top
                {x: -45, y: -20, r: 18, type: 'royal-tulip'},   // Extra filling tulip
                {x: 45, y: -20, r: 18, type: 'royal-tulip'}     // Extra filling tulip
            ];

            layout.forEach((pos, index) => {
                flowers.push(new AdvancedFlower(centerX + pos.x, centerY + pos.y, pos.r, pos.type, index * 10));
            });
        }

        function drawStemsAndRibbon() {
            const centerX = canvas.clientWidth / 2;
            const centerY = canvas.clientHeight / 2 + 10;

            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#1e3f20'; // Realistic dark organic stem color

            // Realistic bunching stems
            for (let i = -25; i <= 25; i += 12.5) {
                ctx.beginPath();
                ctx.moveTo(centerX + i, centerY + 10);
                ctx.quadraticCurveTo(centerX + (i/3), centerY + 65, centerX - (i/2), centerY + 130);
                ctx.stroke();
            }

            // Elegant Silk Satin Ribbon
            ctx.fillStyle = '#ff4b6b';
            ctx.beginPath();
            ctx.arc(centerX, centerY + 65, 14, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ff4b6b';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY + 65);
            ctx.quadraticCurveTo(centerX - 30, centerY + 95, centerX - 25, centerY + 115);
            ctx.moveTo(centerX, centerY + 65);
            ctx.quadraticCurveTo(centerX + 30, centerY + 95, centerX + 25, centerY + 115);
            ctx.stroke();
        }

        function animate() {
            // Clear using CSS pixels
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
            drawStemsAndRibbon();
            flowers.forEach(f => f.draw());
            requestAnimationFrame(animate);
        }

        // Typewriter Sequence
        let charIndex = 0;
        function typeMessage() {
            if (charIndex < msg.length) {
                const char = msg.charAt(charIndex);
                if (char === '\n') {
                    typedTextEl.innerHTML += '<br>';
                } else {
                    // escape HTML just in case
                    const span = document.createElement('span');
                    span.textContent = char;
                    typedTextEl.appendChild(span);
                }
                charIndex++;
                setTimeout(typeMessage, 45); // Flowing reading pace
            } else {
                cursor.style.display = 'none';
            }
        }

        // Action Trigger
        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');

            // Initialize visuals immediately
            resizeCanvas();
            initBouquet();
            animate();
            setTimeout(typeMessage, 600);

            // Robust audio start: use the single, clearly-marked constant above
            const preferredStart = AUDIO_PREFERRED_START_SECONDS; // edit AUDIO_PREFERRED_START_SECONDS near top to change start time

            const tryPlayFrom = () => {
                try {
                    // If duration is available, clamp to duration
                    if (!isNaN(song.duration)) {
                        song.currentTime = Math.min(preferredStart, song.duration - 0.1);
                    } else {
                        song.currentTime = preferredStart;
                    }
                } catch (err) {
                    // Some browsers may reject setting currentTime until metadata is loaded; ignore and proceed to play
                    console.log('Could not set currentTime yet:', err);
                }

                song.play().catch(e => {
                    console.log('Audio playback was blocked or failed:', e);
                });
            };

            if (song.readyState >= 2 || !isNaN(song.duration)) {
                tryPlayFrom();
            } else {
                // Wait for metadata then play
                song.addEventListener('loadedmetadata', tryPlayFrom, { once: true });
                song.load();
            }
        });

        // Initialize background frame once so page doesn't look empty before pressing
        // (Canvas will be redrawn after pressing 'Open with Love')
        resizeCanvas();
        drawStemsAndRibbon();
    </script>
</body>
</html>
